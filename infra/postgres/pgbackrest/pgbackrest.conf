# pgBackRest: full + incremental backups and continuous WAL archiving (point-in-time recovery).
# Repository is a separate Docker volume; production adds a second, off-site repo (repo2-type=s3).
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
compress-type=zst
log-level-console=info
log-level-file=detail
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest

[oralscreen]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
