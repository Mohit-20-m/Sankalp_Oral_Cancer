name: Bug report
description: Something doesn't work as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not attach patient photographs or any personal health information.**
        If the problem is a security issue, report it privately instead (see SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Training pipeline, Model / inference, Model download script, Documentation, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or a commit SHA
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python version, GPU / CPU, Kaggle or local
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
