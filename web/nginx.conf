server {
  listen 8080;
  root /usr/share/nginx/html;
  location = /healthz { access_log off; return 200 "ok"; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  # on-device face landmarks (mouth-opening measurement): WebAssembly runtime + model, cached for a day
  location /mediapipe/ {
    types { application/wasm wasm; application/javascript js; application/octet-stream task; }
    expires 1d;
    try_files $uri =404;
  }
  location = /index.html { add_header Cache-Control "no-cache"; }
  # single-page app: every other path (e.g. /capture/<id>, /provider?card=...) loads index.html
  location / { try_files $uri $uri/ /index.html; }
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
